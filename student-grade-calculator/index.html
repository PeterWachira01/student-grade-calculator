<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>
        <p>Enter the student's marks below.</p>

        <form id="gradeForm">

            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
                required
            >

            <label for="math">Mathematics</label>
            <input
                type="number"
                id="math"
                min="0"
                max="100"
                placeholder="Enter marks"
                required
            >

            <label for="english">English</label>
            <input
                type="number"
                id="english"
                min="0"
                max="100"
                placeholder="Enter marks"
                required
            >

            <label for="computer">Computer Studies</label>
            <input
                type="number"
                id="computer"
                min="0"
                max="100"
                placeholder="Enter marks"
                required
            >

            <label for="science">Science</label>
            <input
                type="number"
                id="science"
                min="0"
                max="100"
                placeholder="Enter marks"
                required
            >

            <label for="socialStudies">Social Studies</label>
            <input
                type="number"
                id="socialStudies"
                min="0"
                max="100"
                placeholder="Enter marks"
                required
            >

            <div class="button-group">
    <button type="submit">Calculate Grade</button>
    <button type="button" id="resetButton">Reset</button>
</div>

        </form>

        <div id="result"></div>
        <div class="grading-scale">
    <h2>Grading Scale</h2>

    <div class="grade-row">
        <span>A</span>
        <span>80 - 100</span>
    </div>

    <div class="grade-row">
        <span>B</span>
        <span>70 - 79</span>
    </div>

    <div class="grade-row">
        <span>C</span>
        <span>60 - 69</span>
    </div>

    <div class="grade-row">
        <span>D</span>
        <span>50 - 59</span>
    </div>

    <div class="grade-row">
        <span>E</span>
        <span>Below 50</span>
    </div>
</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
